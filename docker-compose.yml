
networks:
  default:
     driver: bridge
     name: roboshop
     external: true # I Created network outside manually using create network so i have given it here like this
     # if we did not create it manually, here comment external and it will automatically create the new network

volumes: # this is equvilent to docker volume create volumename
   mongodb:
   redis:
   mysql:
   rabbitmq:

services:
   mongodb:
      image: venkattholeti/mongodb:v1
      container_name: mongodb
      volumes:
        - mongodb:/data/db # volumename: /WhereToMount
   
   catalogue:
      image: venkattholeti/catalogue:v1
      container_name: catalogue
      depends_on:
       - mongodb

   redis:
      image: venkattholeti/redis:v1
      container_name: redis
      volumes:
        - redis:/data # volumename: /WhereToMount

   user:
      image: venkattholeti/user:v1
      container_name: user
      depends_on:
        - redis
        - mongodb

   cart:
       image: venkattholeti/cart:v1
       container_name: cart
       depends_on:
         - catalogue
         - redis

   mysql:
        image: venkattholeti/mysql:v1
        container_name: mysql
        volumes:
          - mysql:/var/lib/mysql
    
   shipping:
        image: venkattholeti/shipping:v1
        container_name: shipping
        depends_on:
           - mysql
           - cart

   rabbitmq:
         image: venkattholeti/rabbitmq:v1
         container_name: rabbitmq
         environment:
            RABBITMQ_DEFAULT_USER: roboshop
            RABBITMQ_DEFAULT_PASS: roboshop123
         volumes:
           - rabbitmq:/var/lib/rabbitmq

   payment:
          image: venkattholeti/payment:v1
          container_name: payment
          environment:
                CART_HOST: cart
                CART_PORT: 8080
                USER_HOST: user
                USER_PORT: 8080
                AMQP_HOST: rabbitmq
                AMQP_USER: roboshop
                AMQP_PASS: roboshop123
          depends_on:
          - rabbitmq
          - cart
          - user
      
   frontend:
          image: venkattholeti/frontend:v1
          container_name: frontend
          ports:
            - "80:80"
          depends_on:
            - catalogue
            - user
            - cart
            - payment
            - shipping